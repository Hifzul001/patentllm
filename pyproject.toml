[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patentllm"
version = "0.1.0"
description = "LLM-generated reports from patent data using RAG, Ollama, FastAPI, and evaluation tooling."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amita Kashid" }]
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "scikit-learn>=1.4.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]
llm = ["langchain>=0.2.0", "langchain-ollama>=0.1.0", "llama-index-core>=0.10.0"]

[project.scripts]
patentllm = "patentllm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
